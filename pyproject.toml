[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cricket-shot-classifier"
version = "0.1.0"
description = "A reproducible three-class cricket batting image classifier"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch==2.6.0", "torchvision==0.21.0", "numpy>=1.26,<3",
  "Pillow>=11,<13", "scikit-learn>=1.5,<2", "PyYAML>=6,<7",
  "requests>=2.32,<3", "ImageHash==4.3.2", "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
app = ["streamlit>=1.49,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
cricket-collect = "cricket_shot_classifier.collect:main"
cricket-prepare = "cricket_shot_classifier.prepare:main"
cricket-train = "cricket_shot_classifier.train:main"
cricket-evaluate = "cricket_shot_classifier.evaluate:main"
cricket-predict = "cricket_shot_classifier.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
